<!DOCTYPE html>
<html>
<head>
    <style>
        .carousel {
            width: 500px;
            margin: auto;
            text-align: center;
        }
        .carousel img {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="carousel">
        <h2>Carousel</h2>
        <img id="carouselImage" src="images/1.jpg" alt="Image">
        <br>
        <button onclick="prevImage()">←</button>
        <button onclick="nextImage()">→</button>
    </div>

    <script>
        let images = ["images/1.jpg", "images/2.jpg", "images/3.jpg"];
        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById("carouselImage").src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById("carouselImage").src = images[currentIndex];
        }
    </script>
</body>
</html>
